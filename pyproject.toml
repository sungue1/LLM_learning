[project]
name = "llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sungue1", email = "sungue4098@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.29.0",
    "gradio>=6.30.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.1",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.29.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[project.scripts]
llm = "llm:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
